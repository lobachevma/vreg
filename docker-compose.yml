services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vreg
      POSTGRES_PASSWORD: vreg
      POSTGRES_DB: vreg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vreg -d vreg"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "94.102.88.15:80:8000"
    environment:
      DATABASE_URL: postgresql://vreg:vreg@db:5432/vreg
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
